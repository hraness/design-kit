name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR runs share one group per ref, so a new push cancels the superseded run.
# main runs are grouped by commit and never cancel each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `bun run check` stays the local all-in-one gate. CI runs the same commands in
# four parallel jobs; each rebuilds dist (about 3 s) so no job waits on another.
jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Verify generated outputs match the build
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:stylex-artifacts
      - run: bun run check:stylex-determinism
      - run: bun run test:package
      - run: bun pm pack --dry-run --ignore-scripts
      - run: node --input-type=module -e 'await Promise.all([import("./dist/index.js"), import("./dist/react/index.js"), import("./dist/react/server.js"), import("./dist/provider-marks.js"), import("./dist/syntax-highlighting.js")])'
      - name: Verify generated outputs after the static checks
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run test
      - name: Verify tests left generated outputs unchanged
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  browser-marketing:
    name: Browser (product marketing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - run: bun ./node_modules/playwright-core/cli.js install --with-deps chromium
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - run: bun run test:browser:marketing

  browser-rest:
    name: Browser (other surfaces)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - run: bun ./node_modules/playwright-core/cli.js install --with-deps chromium
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Check shared controls, mockups, and agent setup
        run: bun run test:browser:rest

  required:
    name: Required
    if: always()
    needs: [static, unit, browser-marketing, browser-rest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER_MARKETING: ${{ needs.browser-marketing.result }}
          BROWSER_REST: ${{ needs.browser-rest.result }}
        run: |
          set -euo pipefail
          for result in "$STATIC" "$UNIT" "$BROWSER_MARKETING" "$BROWSER_REST"; do
            [[ "$result" == success ]] || exit 1
          done
